services:

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pds_user
      POSTGRES_PASSWORD: pds_pass
      POSTGRES_DB: pds_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pds_user -d pds_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    init: true
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
      - ./pedespi_videos:/data/sample_clips
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  worker:
    build: ./backend
    init: true
    env_file: .env
    depends_on:
      api:
        condition: service_started
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app
      - ./backend/models:/models
      - ./pedespi_videos:/data/sample_clips
    command: ["python", "-m", "app.worker"]

  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - CHOKIDAR_USEPOLLING=true
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - api

volumes:
  postgres_data: